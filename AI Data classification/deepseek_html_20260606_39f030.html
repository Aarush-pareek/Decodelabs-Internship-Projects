<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict New Data | NexusClassify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">⚡ NexusClassify</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/results">Results</a>
            <a href="/predict">Predict</a>
        </div>
    </nav>

    <div style="padding: 2rem;">
        <h1>🔮 Make a Prediction</h1>
        <div class="glass-card">
            <form id="predictionForm">
                <div id="featureInputs"></div>
                <button type="submit" class="btn-neon" style="margin-top: 1rem;">Predict</button>
            </form>
            <div id="predictionResult" style="margin-top: 2rem; font-size: 1.5rem;"></div>
        </div>
    </div>

    <script>
        // Fetch feature names from backend or use session storage
        async function loadFeatures() {
            // We'll get features from session via a simple fetch to /predict (GET returns form)
            // But we already have features passed from Flask render_template? We'll use a separate endpoint.
            const res = await fetch('/predict');  // GET returns HTML but we want JSON of features
            // Alternatively, extract from page context: we can embed via template.
            // Here we'll use sessionStorage from results or a dedicated endpoint.
            const featuresRes = await fetch('/get_features');
            if (featuresRes.ok) {
                const features = await featuresRes.json();
                renderForm(features);
            } else {
                document.getElementById('featureInputs').innerHTML = '<p>No trained model. Please train first.</p>';
            }
        }

        function renderForm(features) {
            let html = '';
            features.forEach(f => {
                html += `<label>${f}</label><input type="text" name="${f}" required>`;
            });
            document.getElementById('featureInputs').innerHTML = html;
        }

        document.getElementById('predictionForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const features = {};
            for (let [key, value] of formData.entries()) {
                features[key] = isNaN(value) ? value : parseFloat(value);
            }
            const res = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ features })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('predictionResult').innerHTML = `
                    <div class="glass-card">Prediction: <strong>${data.prediction.prediction_label}</strong><br>
                    Probabilities: ${JSON.stringify(data.prediction.probabilities)}</div>
                `;
            } else {
                alert('Error: ' + data.error);
            }
        };

        loadFeatures();
    </script>
</body>
</html>
