<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Results | NexusClassify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">⚡ NexusClassify</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/results">Results</a>
            <a href="/predict">Predict</a>
        </div>
    </nav>

    <div style="padding: 2rem;">
        <h1>📈 Model Evaluation Results</h1>
        <div id="resultsContainer" class="glass-card">
            <p>No model trained yet. Please go to <a href="/dashboard">Dashboard</a> and train a model.</p>
        </div>
    </div>

    <script>
        window.onload = () => {
            const saved = sessionStorage.getItem('lastResults');
            if (saved) {
                const data = JSON.parse(saved);
                const metrics = data.metrics;
                const container = document.getElementById('resultsContainer');
                container.innerHTML = `
                    <div class="metrics-grid">
                        <div class="metric-card"><div class="metric-value">${metrics.accuracy}</div><div class="metric-label">Accuracy</div></div>
                        <div class="metric-card"><div class="metric-value">${metrics.precision}</div><div class="metric-label">Precision</div></div>
                        <div class="metric-card"><div class="metric-value">${metrics.recall}</div><div class="metric-label">Recall</div></div>
                        <div class="metric-card"><div class="metric-value">${metrics.f1_score}</div><div class="metric-label">F1 Score</div></div>
                    </div>
                    <h3>Confusion Matrix</h3>
                    <img src="data:image/png;base64,${data.confusion_matrix_image}" style="width:100%; max-width:500px;">
                    ${data.feature_importance_image ? `<h3>Feature Importance</h3><img src="data:image/png;base64,${data.feature_importance_image}" style="width:100%; max-width:600px;">` : ''}
                    <h3>AI Insight</h3>
                    <p>${generateInsight(metrics, data.algorithm)}</p>
                    <button class="btn-neon" onclick="downloadResults()">📥 Download Report (CSV)</button>
                `;
            }
        };

        function generateInsight(metrics, algo) {
            let insight = `The ${algo} model achieved ${(metrics.accuracy*100).toFixed(1)}% accuracy. `;
            if (metrics.f1_score > 0.9) insight += "Excellent performance across all classes. ";
            else if (metrics.f1_score > 0.7) insight += "Good performance; consider feature engineering for improvement. ";
            else insight += "Model may need more data or hyperparameter tuning. ";
            return insight;
        }

        function downloadResults() {
            alert("Export functionality would generate PDF/CSV. In production, implement with jsPDF or server-side.");
        }
    </script>
</body>
</html>
